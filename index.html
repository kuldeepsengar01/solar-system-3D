<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>3D Solar System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

canvas{
    display:block;
}


/* =========================================
   BACKGROUND UI
========================================= */

.title{

    position:fixed;

    top:22px;
    left:50%;

    transform:translateX(-50%);

    color:#ffffff;

    font-size:27px;

    letter-spacing:8px;

    z-index:20;

    pointer-events:none;

    text-shadow:
        0 0 10px #36d9ff,
        0 0 25px #168cff,
        0 0 50px #004cff;

}

.subtitle{

    position:fixed;

    top:62px;
    left:50%;

    transform:translateX(-50%);

    color:
        rgba(255,255,255,.45);

    font-size:10px;

    letter-spacing:4px;

    z-index:20;

    pointer-events:none;

}


/* =========================================
   LEFT INFO PANEL
========================================= */

.info-panel{

    position:fixed;

    left:22px;
    top:50%;

    transform:
        translateY(-50%);

    width:230px;

    padding:18px;

    border-radius:16px;

    background:
        linear-gradient(
            145deg,
            rgba(10,25,50,.85),
            rgba(2,7,20,.72)
        );

    border:
        1px solid
        rgba(80,190,255,.25);

    box-shadow:
        0 0 30px
        rgba(0,130,255,.08);

    backdrop-filter:
        blur(15px);

    color:white;

    z-index:20;

}

.info-title{

    font-size:11px;

    color:#5edfff;

    letter-spacing:3px;

    margin-bottom:15px;

}

.stat{

    display:flex;

    justify-content:space-between;

    padding:9px 0;

    border-bottom:
        1px solid
        rgba(255,255,255,.07);

    font-size:11px;

}

.stat span:first-child{

    color:
        rgba(255,255,255,.5);

}

.stat span:last-child{

    color:#fff;

}


/* =========================================
   RIGHT CONTROLS
========================================= */

.controls{

    position:fixed;

    right:22px;
    bottom:22px;

    display:flex;

    gap:8px;

    z-index:20;

}

button{

    padding:
        10px 15px;

    border:
        1px solid
        rgba(80,190,255,.35);

    border-radius:9px;

    background:
        rgba(5,18,40,.8);

    color:#bcefff;

    cursor:pointer;

    font-size:10px;

    letter-spacing:1px;

    transition:.25s;

}

button:hover{

    background:
        rgba(15,80,140,.6);

    box-shadow:
        0 0 18px
        rgba(50,180,255,.3);

}


/* =========================================
   BOTTOM STATUS
========================================= */

.status{

    position:fixed;

    left:22px;
    bottom:22px;

    color:
        rgba(255,255,255,.45);

    font-size:10px;

    letter-spacing:2px;

    z-index:20;

}

.status b{

    color:#54e7ff;

}

</style>
</head>


<body>


<div class="title">
    SOLAR SYSTEM
</div>


<div class="subtitle">
    THREE.JS • REAL-TIME 3D SPACE SIMULATION
</div>


<!-- =========================================
     INFO PANEL
========================================= -->

<div class="info-panel">

    <div class="info-title">
        SYSTEM DATA
    </div>

    <div class="stat">
        <span>Planets</span>
        <span id="planetCount">8</span>
    </div>

    <div class="stat">
        <span>Earth Distance</span>
        <span id="earthDistance">105 AU</span>
    </div>

    <div class="stat">
        <span>Orbit Speed</span>
        <span id="orbitSpeed">1.0x</span>
    </div>

    <div class="stat">
        <span>FPS</span>
        <span id="fps">60</span>
    </div>

    <div class="stat">
        <span>Stars</span>
        <span>12,000</span>
    </div>

    <div class="stat">
        <span>Asteroids</span>
        <span>1,500</span>
    </div>

</div>


<div class="status">
    STATUS :
    <b>LIVE</b>
</div>


<div class="controls">

    <button id="slow">
        SPEED -
    </button>

    <button id="pause">
        PAUSE
    </button>

    <button id="fast">
        SPEED +
    </button>

    <button id="reset">
        RESET CAMERA
    </button>

</div>


<!-- =========================================
     THREE.JS
========================================= -->

<script type="importmap">
{
    "imports": {

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

    }
}
</script>


<script type="module">

import * as THREE
from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import {
    OrbitControls
}
from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";


// =====================================================
// SCENE
// =====================================================

const scene =
    new THREE.Scene();


// =====================================================
// CAMERA
// =====================================================

const camera =
    new THREE.PerspectiveCamera(
        60,
        innerWidth / innerHeight,
        .1,
        5000
    );

camera.position.set(
    0,
    220,
    500
);


// =====================================================
// RENDERER
// =====================================================

const renderer =
    new THREE.WebGLRenderer({

        antialias:true,

        powerPreference:
            "high-performance"

    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.35;

document.body.appendChild(
    renderer.domElement
);


// =====================================================
// CAMERA CONTROLS
// =====================================================

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping =
    true;

controls.dampingFactor =
    .04;

controls.minDistance =
    70;

controls.maxDistance =
    1100;


// =====================================================
// SPACE BACKGROUND
// =====================================================

scene.background =
    new THREE.Color(
        0x01030b
    );


// =====================================================
// STARS
// =====================================================

const starGeometry =
    new THREE.BufferGeometry();

const STAR_COUNT =
    12000;

const starPositions =
    new Float32Array(
        STAR_COUNT * 3
    );

for(
    let i=0;
    i<STAR_COUNT;
    i++
){

    const i3 =
        i*3;

    const radius =
        800 +
        Math.random()*1600;

    const theta =
        Math.random()
        * Math.PI*2;

    const phi =
        Math.acos(
            Math.random()*2-1
        );

    starPositions[i3] =
        radius *
        Math.sin(phi) *
        Math.cos(theta);

    starPositions[i3+1] =
        radius *
        Math.cos(phi);

    starPositions[i3+2] =
        radius *
        Math.sin(phi) *
        Math.sin(theta);

}

starGeometry.setAttribute(

    "position",

    new THREE.BufferAttribute(
        starPositions,
        3
    )

);

const starMaterial =
    new THREE.PointsMaterial({

        color:
            0xffffff,

        size:
            1.4,

        transparent:
            true,

        opacity:
            .9

    });

const stars =
    new THREE.Points(

        starGeometry,

        starMaterial

    );

scene.add(
    stars
);


// =====================================================
// SUN
// =====================================================

const sunGeometry =
    new THREE.SphereGeometry(
        34,
        96,
        96
    );

const sunMaterial =
    new THREE.MeshBasicMaterial({

        color:
            0xffaa16

    });

const sun =
    new THREE.Mesh(

        sunGeometry,

        sunMaterial

    );

scene.add(
    sun
);


// =====================================================
// SUN GLOW
// =====================================================

const glowGeometry =
    new THREE.SphereGeometry(
        48,
        64,
        64
    );

const glowMaterial =
    new THREE.MeshBasicMaterial({

        color:
            0xff6200,

        transparent:
            true,

        opacity:
            .17,

        side:
            THREE.BackSide

    });

const glow =
    new THREE.Mesh(

        glowGeometry,

        glowMaterial

    );

scene.add(
    glow
);


// =====================================================
// SUN LIGHT
// =====================================================

const sunLight =
    new THREE.PointLight(

        0xffffff,

        7,

        1800

    );

scene.add(
    sunLight
);


// =====================================================
// AMBIENT
// =====================================================

const ambient =
    new THREE.AmbientLight(

        0xffffff,

        .45

    );

scene.add(
    ambient
);


// =====================================================
// BLUE FILL LIGHT
// =====================================================

const blueLight =
    new THREE.PointLight(

        0x3388ff,

        1.5,

        1000

    );

blueLight.position.set(
    -300,
    200,
    300
);

scene.add(
    blueLight
);


// =====================================================
// PLANET CREATOR
// =====================================================

function createPlanet(

    radius,

    distance,

    color,

    speed

){

    const geometry =
        new THREE.SphereGeometry(

            radius,

            64,

            64

        );


    const material =
        new THREE.MeshPhongMaterial({

            color:
                color,

            shininess:
                35,

            specular:
                0x555555,

            emissive:
                color,

            emissiveIntensity:
                .045

        });


    const planet =
        new THREE.Mesh(

            geometry,

            material

        );


    const orbit =
        new THREE.Group();


    orbit.add(
        planet
    );


    planet.position.x =
        distance;


    scene.add(
        orbit
    );


    return {

        orbit,

        planet,

        distance,

        speed,

        angle:
            Math.random()
            * Math.PI*2

    };

}


// =====================================================
// ORBIT CREATOR
// =====================================================

function createOrbit(
    radius
){

    const points=[];


    for(
        let i=0;
        i<=256;
        i++
    ){

        const angle =
            i/256 *
            Math.PI*2;


        points.push(

            new THREE.Vector3(

                Math.cos(angle)
                * radius,

                0,

                Math.sin(angle)
                * radius

            )

        );

    }


    const geometry =
        new THREE.BufferGeometry()
        .setFromPoints(
            points
        );


    const material =
        new THREE.LineBasicMaterial({

            color:
                0x27617c,

            transparent:
                true,

            opacity:
                .32

        });


    const orbit =
        new THREE.Line(

            geometry,

            material

        );


    scene.add(
        orbit
    );

}


// =====================================================
// PLANETS
// =====================================================

const planets=[];


// Mercury

createOrbit(52);

planets.push(

    createPlanet(
        5,
        52,
        0xb9b9b9,
        .018
    )

);


// Venus

createOrbit(78);

planets.push(

    createPlanet(
        8,
        78,
        0xffbd58,
        .014
    )

);


// Earth

createOrbit(108);

const earth =
createPlanet(
    11,
    108,
    0x167dff,
    .010
);

planets.push(
    earth
);


// Mars

createOrbit(143);

planets.push(

    createPlanet(
        7,
        143,
        0xff3b20,
        .007
    )

);


// Jupiter

createOrbit(200);

planets.push(

    createPlanet(
        23,
        200,
        0xe0a16e,
        .0035
    )

);


// Saturn

createOrbit(265);

const saturn =
createPlanet(
    19,
    265,
    0xffcf76,
    .0025
);

planets.push(
    saturn
);


// Uranus

createOrbit(325);

planets.push(

    createPlanet(
        14,
        325,
        0x35e4ed,
        .0018
    )

);


// Neptune

createOrbit(385);

planets.push(

    createPlanet(
        13,
        385,
        0x2b63ff,
        .0014
    )

);


// =====================================================
// EARTH ATMOSPHERE
// =====================================================

const earthAtmosphere =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            11.6,
            64,
            64
        ),

        new THREE.MeshBasicMaterial({

            color:
                0x29aaff,

            transparent:
                true,

            opacity:
                .15,

            side:
                THREE.BackSide

        })

    );

earth.planet.add(
    earthAtmosphere
);


// =====================================================
// EARTH CONTINENTS
// =====================================================

const continentMaterial =
    new THREE.MeshBasicMaterial({

        color:
            0x28c76f,

        transparent:
            true,

        opacity:
            .65

    });


// Small decorative land masses

const land1 =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            11.05,
            32,
            16
        ),

        continentMaterial

    );

earth.planet.add(
    land1
);


// =====================================================
// MOON
// =====================================================

const moon =
new THREE.Mesh(

    new THREE.SphereGeometry(
        3,
        32,
        32
    ),

    new THREE.MeshPhongMaterial({

        color:
            0x999999,

        shininess:
            5

    })

);

earth.planet.add(
    moon
);


// =====================================================
// SATURN RINGS
// =====================================================

const ringGeometry =
    new THREE.RingGeometry(
        25,
        40,
        160
    );


const ringMaterial =
    new THREE.MeshBasicMaterial({

        color:
            0xd8bd83,

        side:
            THREE.DoubleSide,

        transparent:
            true,

        opacity:
            .85

    });


const rings =
    new THREE.Mesh(

        ringGeometry,

        ringMaterial

    );


rings.rotation.x =
    Math.PI/2.25;


saturn.planet.add(
    rings
);


// =====================================================
// SECOND RING
// =====================================================

const ring2 =
new THREE.Mesh(

    new THREE.RingGeometry(
        20,
        24,
        160
    ),

    new THREE.MeshBasicMaterial({

        color:
            0x80633d,

        side:
            THREE.DoubleSide,

        transparent:
            true,

        opacity:
            .8

    })

);

ring2.rotation.x =
    Math.PI/2.25;

saturn.planet.add(
    ring2
);


// =====================================================
// ASTEROID BELT
// =====================================================

const asteroidGeometry =
    new THREE.BufferGeometry();


const ASTEROIDS =
    1500;


const asteroidPositions =
    new Float32Array(
        ASTEROIDS*3
    );


for(
    let i=0;
    i<ASTEROIDS;
    i++
){

    const radius =
        160 +
        Math.random()*35;


    const angle =
        Math.random()
        * Math.PI*2;


    const i3 =
        i*3;


    asteroidPositions[i3] =
        Math.cos(angle)
        * radius;


    asteroidPositions[i3+1] =
        (Math.random()-.5)
        * 10;


    asteroidPositions[i3+2] =
        Math.sin(angle)
        * radius;

}


asteroidGeometry.setAttribute(

    "position",

    new THREE.BufferAttribute(
        asteroidPositions,
        3
    )

);


const asteroidMaterial =
    new THREE.PointsMaterial({

        color:
            0xa88a67,

        size:
            1.3

    });


const asteroids =
    new THREE.Points(

        asteroidGeometry,

        asteroidMaterial

    );


scene.add(
    asteroids
);


// =====================================================
// ANIMATION
// =====================================================

let speed =
    1;

let paused =
    false;


const clock =
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    if(!paused){

        const delta =
            clock.getDelta();


        // Sun

        sun.rotation.y +=
            .002 * speed;


        glow.scale.setScalar(

            1 +
            Math.sin(
                performance.now()
                *.002
            )*.035

        );


        // Stars

        stars.rotation.y +=
            .00005 * speed;


        // Asteroids

        asteroids.rotation.y +=
            .0006 * speed;


        // Planets

        planets.forEach(

            p => {

                p.angle +=
                    p.speed *
                    speed;


                p.orbit.rotation.y =
                    p.angle;


                p.planet.rotation.y +=
                    .008 * speed;

            }

        );


        // Moon

        const t =
            performance.now()
            *.001;

        moon.position.x =
            Math.cos(t*.7)
            * 17;

        moon.position.z =
            Math.sin(t*.7)
            * 17;


        // Saturn ring

        rings.rotation.z +=
            .001 * speed;

        ring2.rotation.z -=
            .0015 * speed;

    }


    controls.update();


    renderer.render(
        scene,
        camera
    );

}


animate();


// =====================================================
// FPS CALCULATION
// =====================================================

let frames=0;

let lastTime=
performance.now();


function calculateFPS(){

    frames++;

    const now=
        performance.now();


    if(
        now-lastTime >= 1000
    ){

        document
        .getElementById(
            "fps"
        )
        .textContent =
            frames;


        frames=0;

        lastTime=now;

    }


    requestAnimationFrame(
        calculateFPS
    );

}

calculateFPS();


// =====================================================
// SPEED BUTTONS
// =====================================================

document
.getElementById("slow")
.addEventListener(
    "click",
    ()=>{

        speed =
            Math.max(
                .25,
                speed-.25
            );


        document
        .getElementById(
            "orbitSpeed"
        )
        .textContent =
            speed.toFixed(2)+"x";

    }
);


document
.getElementById("fast")
.addEventListener(
    "click",
    ()=>{

        speed =
            Math.min(
                5,
                speed+.25
            );


        document
        .getElementById(
            "orbitSpeed"
        )
        .textContent =
            speed.toFixed(2)+"x";

    }
);


// =====================================================
// PAUSE
// =====================================================

document
.getElementById("pause")
.addEventListener(
    "click",
    function(){

        paused =
            !paused;


        this.textContent =
            paused
            ? "PLAY"
            : "PAUSE";

    }
);


// =====================================================
// RESET CAMERA
// =====================================================

document
.getElementById("reset")
.addEventListener(
    "click",
    ()=>{

        camera.position.set(
            0,
            220,
            500
        );

        controls.target.set(
            0,
            0,
            0
        );

        controls.update();

    }
);


// =====================================================
// EARTH CALCULATION
// =====================================================

setInterval(
    ()=>{

        const earthDistance =
            earth.distance;


        document
        .getElementById(
            "earthDistance"
        )
        .textContent =
            earthDistance
            +" AU";

    },
    500
);


// =====================================================
// RESIZE
// =====================================================

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth/
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
